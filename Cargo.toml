[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
rusb = "0.9"
humantime = "2.1"
clap = { version = "4.5", features = ["derive"] }
